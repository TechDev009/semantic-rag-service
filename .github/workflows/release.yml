name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify release
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
      - name: Create source archive
        run: |
          archive_name="${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${archive_name}/" "$GITHUB_SHA" \
            -o "dist/${archive_name}.tar.gz"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
