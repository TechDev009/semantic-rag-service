[project]
name = "semantic-rag-service"
version = "0.1.0"
description = "Standalone semantic search and retrieval-augmented generation API"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "AI SaaS Foundation" }]
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "numpy>=2.0.0",
  "openai>=1.54.0",
  "pgvector>=0.3.5",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.115.0",
  "pyright>=1.1.388",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
semantic-rag = "semantic_rag.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_rag"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [".venv", "alembic"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportOptionalMemberAccess = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[dependency-groups]
dev = [
  "hypothesis>=6.115.0",
  "pyright>=1.1.388",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
